  <rect x="308" y="176" width="220" height="44" rx="22" fill="#0F172A" fill-opacity="0.92"/>
  <text x="418" y="204" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">SkillForest</text>

  <text x="340" y="266" fill="#0F172A" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">Grow your local skills</text>
  <text x="340" y="324" fill="#0F172A" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">into a living forest.</text>

  <text x="340" y="380" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Maintain in one repo. Sync to one runtime directory.</text>
  <text x="340" y="414" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Observe usage, quality, and drift before the sprawl wins.</text>

  <g>
