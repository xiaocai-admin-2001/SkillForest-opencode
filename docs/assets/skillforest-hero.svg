    <rect x="340" y="444" width="132" height="20" rx="10" fill="url(#accent)"/>
    <text x="525" y="459" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">single-source workflow</text>
  </g>

